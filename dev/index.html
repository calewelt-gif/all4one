<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSG/HSV Wuppertal Wochen-Dashboard</title><style>
:root{--g:#2f714d;--lg:#63a84e;--dg:#153b29;--r:#cf342f;--bg:#f4f7f4;--ink:#252a27;--muted:#68736c;--gold:#f2a32b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1180px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,var(--dg),var(--g));color:white;border-radius:22px;padding:28px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em}.hero h1{margin:6px 0;font-size:34px}.meta{opacity:.84}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}.card,.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 3px 14px #153b2912}.card b{display:block;font-size:30px;color:var(--dg)}.up{color:#168c45;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel h2{margin:0 0 14px;color:var(--dg)}.fixture,.result{display:grid;grid-template-columns:90px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #e6ebe7;align-items:center}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:99px;background:#e9f5e5;color:var(--g)}.hot{background:#fff0d8;color:#9a5700}.score{font-size:19px;font-weight:800}.win{color:var(--g)}.loss{color:var(--r)}.bars{display:flex;align-items:center;gap:7px;height:110px;margin-top:7px}.barwrap{flex:1;text-align:center;font-size:11px;color:var(--muted)}.bar{height:76px;display:flex;align-items:flex-end;justify-content:center}.bar i{display:block;width:75%;border-radius:6px 6px 0 0}.table-panel{margin-top:18px;overflow:hidden}.table-title{margin:0 0 14px!important;position:static!important;transform:none!important}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}th{background:#c63f28;color:white;text-align:left;padding:12px 10px}td{padding:11px 10px;border-bottom:1px solid #e5e9e6}.us{background:#eef8ea;color:#a93221;font-weight:700}.form span{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;color:white;font-size:12px;font-weight:800;margin-right:3px}.s{background:var(--lg)}.n{background:var(--r)}footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero h1{font-size:27px}main{padding:12px}.fixture,.result{grid-template-columns:72px 1fr auto}}
</style></head><body><main><section class="hero"><div class="eyebrow">SSG/HSV WUPPERTAL · WEIBLICHE B-JUGEND</div><h1>Wochen-Dashboard DEV</h1><div class="meta" id="meta"></div><div class="cards" id="cards"></div></section><section class="grid"><div class="panel"><h2>Rückblick</h2><div id="results"></div><div class="bars" id="bars"></div></div><div class="panel"><h2>Die nächsten 5 Spiele</h2><div id="fixtures"></div></div></section><section class="panel table-panel"><h2 class="table-title">Aktuelle Tabelle</h2><div class="table-scroll"><table><thead><tr><th>Pl.</th><th>Mannschaft</th><th>Sp</th><th>Pkt.</th><th>Tore</th><th>Diff.</th><th>S</th><th>U</th><th>N</th><th>Form</th></tr></thead><tbody id="tbody"></tbody></table></div></section><footer>Stand <span id="stand"></span> · Daten nach bestätigten Ergebnissen</footer></main><script src="dashboard-daten.js"></script><script>
const d=window.DASHBOARD_DATA;$=x=>document.getElementById(x);$('meta').textContent=`${d.liga} · Stand ${d.stand}`;$('stand').textContent=d.stand;$('cards').innerHTML=[[`Platz ${d.platz}`,`<span class="up">↑ ${d.tendenz}</span>`],[d.punkte,'Punkte'],[`${d.siege}:${d.niederlagen}`,'Siege : Niederlagen'],[d.tore,'Tore'],[`+${d.differenz}`,'Tordifferenz']].map(x=>`<div class="card"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('results').innerHTML=d.rueckblick.map(x=>`<div class="result"><strong>${x[0]}</strong><span>${x[1]}</span><span class="score ${x[3]=='S'?'win':'loss'}">${x[2]} · ${x[3]}</span></div>`).join('');$('bars').innerHTML=d.rueckblick.map(x=>{let h=Math.max(12,Math.abs(x[4])*4);return `<div class="barwrap"><div class="bar"><i style="height:${h}px;background:${x[4]>=0?'var(--g)':'var(--r)'}"></i></div>${x[4]>0?'+':''}${x[4]}<br>${x[0]}</div>`}).join('');$('fixtures').innerHTML=d.naechste.map((x,i)=>`<div class="fixture"><strong>${x[0]}<br><small>${x[1]}</small></strong><span>${x[2]}<br><small>${x[3]}</small></span>${x[4]?`<span class="badge ${i<2?'hot':''}">${x[4]}</span>`:''}</div>`).join('');$('tbody').innerHTML=d.tabelle.map(x=>`<tr class="${x[1]==d.team?'us':''}"><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${x[5]>0?'+':''}${x[5]}</td><td>${x[6]}</td><td>${x[7]}</td><td>${x[8]}</td><td class="form">${[...x[9]].map(v=>`<span class="${v.toLowerCase()}">${v}</span>`).join('')}</td></tr>`).join('');
</script></body></html>
